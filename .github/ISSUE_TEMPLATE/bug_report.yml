name: Bug report
description: Something isn't working the way you expected.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a report. The more specific you can be, the faster
        this gets fixed.

  - type: input
    id: macos-version
    attributes:
      label: macOS version
      description: e.g. "Sequoia 15.4" or "Tahoe 26.1".
      placeholder: macOS 15.4
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: macSubtitleOCR version
      description: From the menu bar → macSubtitleOCR → About.
      placeholder: v1.0.0
    validations:
      required: true

  - type: dropdown
    id: hardware
    attributes:
      label: Hardware
      options:
        - Apple silicon (M-series)
        - Intel
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: |
        Concrete steps. Decoding bugs are much easier to fix with a file that
        reproduces them — a short clip cut from the source, or the extracted
        subtitle track on its own, is usually enough and carries no video or
        audio.
      placeholder: |
        1. Drop Film.mkv onto the window
        2. Tick "English — SDH"
        3. Press Recognize
        4. Every cue after 00:42 comes out blank
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Notes shown for the track
      description: |
        If the track detail showed a "notes" disclosure, paste what it said.
      render: shell
    validations:
      required: false
