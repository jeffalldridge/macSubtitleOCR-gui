name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & test
    # macos-26 ships Xcode 26, which is required for the Icon Composer icon
    # (actool) and the macOS 26 SDK the optional Apple Intelligence features
    # are compiled against.
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode 26
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app || \
            sudo xcode-select -s /Applications/Xcode_26.5.app || \
            sudo xcode-select -s /Applications/Xcode_26.4.1.app
          swift --version
          xcodebuild -version

      - name: Build (universal)
        run: make build

      - name: Test
        # The engine suites run real Vision recognition against the Sintel
        # fixtures, so this needs a full macOS runner, not a container.
        run: make test

      - name: Assemble .app (ad-hoc signed)
        run: make app

      - name: Verify the bundle
        run: |
          set -euo pipefail
          APP=build/macSubtitleOCR-gui.app
          codesign --verify --deep --strict --verbose=1 "$APP"
          lipo -archs "$APP/Contents/MacOS/macSubtitleOCR-gui" | tee /dev/stderr | grep -q arm64
          lipo -archs "$APP/Contents/MacOS/macSubtitleOCR-gui" | grep -q x86_64
          # make app already runs this; re-run it explicitly so a packaging
          # regression is visible as its own failed step.
          "$APP/Contents/MacOS/macSubtitleOCR-gui" --self-check
          "$APP/Contents/MacOS/macSubtitleOCR-gui" --version
